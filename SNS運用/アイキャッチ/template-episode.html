<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 670px; overflow: hidden; }
  body {
    position: relative;
    background: #dcdde0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  /* やわらかい影(ぼかした斜めのシェイプでテンプレートの雰囲気を再現) */
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; filter: blur(48px); opacity: 0.55; }
  .b1 { width: 900px; height: 260px; background: #a4a7ad; transform: rotate(-32deg); top: -60px; left: 320px; border-radius: 40% 60% 50% 50%; }
  .b2 { width: 700px; height: 180px; background: #b0b3b9; transform: rotate(-30deg); top: 240px; left: -120px; border-radius: 50%; }
  .b3 { width: 520px; height: 150px; background: #9a9da3; transform: rotate(-35deg); top: 430px; left: 620px; border-radius: 50%; opacity: 0.5; }
  .b4 { width: 400px; height: 700px; background: #f4f4f6; transform: rotate(-28deg); top: -100px; left: 60px; border-radius: 50%; opacity: 0.7; }
  .b5 { width: 300px; height: 500px; background: #f2f2f4; transform: rotate(-30deg); top: 200px; right: -60px; border-radius: 50%; opacity: 0.6; }

  /* 細枠(右辺はEPISODEテキストの下から下端まで) */
  .frame {
    position: absolute; inset: 34px;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
  }
  .frame-right {
    position: absolute; right: 34px; top: 268px; bottom: 34px;
    width: 2px; background: #ffffff;
  }
  .episode {
    position: absolute; right: 12px; top: 40px;
    writing-mode: vertical-rl;
    font-family: "Times New Roman", "Hiragino Mincho ProN", serif;
    font-size: 26px; letter-spacing: 0.35em; color: #6d6f73;
  }

  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .title {
    font-size: 58px; font-weight: 600; color: #4b4d51;
    letter-spacing: 0.14em; line-height: 1.75;
  }
  .subtitle {
    margin-top: 46px;
    font-size: 27px; font-weight: 400; color: #5c5e62;
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="blob b4"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b5"></div>
  </div>
  <div class="frame"></div>
  <div class="frame-right"></div>
  <div class="episode">EPISODE 03</div>
  <div class="center">
    <div class="title">家賃が倍になったら、<br>朝ごはんを食べる人になった話</div>
    <div class="subtitle">｜毎朝、焼きたてパンが並ぶマンションの話｜</div>
  </div>
</body>
</html>
